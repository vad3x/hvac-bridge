[package]
name = "hvac-adapter-cn105"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Mitsubishi Electric CN105 protocol adapter for HVAC Bridge"

[dependencies]
hvac-core = { path = "../hvac-core", default-features = false }
log = { workspace = true }
embassy-time = { workspace = true, features = ["generic-queue-8"] }

[target.'cfg(target_arch = "riscv32")'.dependencies]
esp-hal = { workspace = true, features = ["log-04", "unstable", "esp32c6"] }

[dev-dependencies]
futures = { workspace = true }
critical-section = { workspace = true, features = ["std"] }
embassy-time = { workspace = true, features = ["std", "generic-queue-8"] }


